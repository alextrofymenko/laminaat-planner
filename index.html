<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminaat Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1>Laminaat Planner</h1>

            <section class="panel">
                <h2>Room</h2>
                <div class="room-controls">
                    <button id="btn-new-room" class="btn btn-primary">Draw New Room</button>
                    <button id="btn-clear-room" class="btn btn-secondary">Clear Room</button>
                    <p class="hint" id="room-hint">Click on canvas to place vertices. Click near the first point to close the room.</p>
                </div>
                <div class="walls-list" id="walls-list"></div>
            </section>

            <section class="panel">
                <h2>Plank Settings</h2>
                <div class="form-group">
                    <label for="plank-length">Length (cm)</label>
                    <input type="number" id="plank-length" value="120" min="10" max="300" step="0.1">
                </div>
                <div class="form-group">
                    <label for="plank-width">Width (cm)</label>
                    <input type="number" id="plank-width" value="20" min="5" max="50" step="0.1">
                </div>
                <div class="form-group">
                    <label for="floor-rotation">Rotation (°)</label>
                    <input type="range" id="floor-rotation" value="0" min="-90" max="90" step="0.1">
                    <span id="rotation-value">0°</span>
                </div>
                <div class="form-group">
                    <label for="offset-pattern">Offset Pattern</label>
                    <select id="offset-pattern">
                        <option value="0.5">1/2 (50%)</option>
                        <option value="0.333">1/3 (33%)</option>
                        <option value="0.25">1/4 (25%)</option>
                        <option value="custom">Custom...</option>
                    </select>
                </div>
                <div class="form-group" id="custom-offset-group" style="display: none;">
                    <label for="custom-offset">Custom Offset (%)</label>
                    <input type="range" id="custom-offset" value="50" min="5" max="95" step="5">
                    <span id="custom-offset-value">50%</span>
                </div>
            </section>

            <section class="panel">
                <h2>Minimum Dimensions</h2>
                <div class="form-group">
                    <label for="min-length">Min Length (cm)</label>
                    <input type="number" id="min-length" value="30" min="1" max="100" step="0.1">
                </div>
                <div class="form-group">
                    <label for="min-width">Min Width (cm)</label>
                    <input type="number" id="min-width" value="5" min="1" max="20" step="0.1">
                </div>
            </section>

            <section class="panel stats-panel">
                <h2>Statistics</h2>
                <div class="stat-row">
                    <span class="stat-label">Room Area</span>
                    <span class="stat-value" id="stat-area">— m²</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Full Planks</span>
                    <span class="stat-value" id="stat-full-planks">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Cut Pieces</span>
                    <span class="stat-value" id="stat-cut-pieces">—</span>
                </div>
                <div class="stat-row warning" id="stat-warning-row" style="display: none;">
                    <span class="stat-label">Too Small</span>
                    <span class="stat-value" id="stat-too-small">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Waste</span>
                    <span class="stat-value" id="stat-waste">— cm²</span>
                </div>
            </section>

            <section class="panel plank-preview-panel" id="plank-preview-panel" style="display: none;">
                <h2>Selected Plank</h2>
                <canvas id="plank-preview-canvas" width="200" height="120"></canvas>
                <div class="plank-info" id="plank-info"></div>
            </section>

            <section class="panel">
                <h2>View</h2>
                <button id="btn-fit-view" class="btn btn-secondary">Fit to View</button>
                <button id="btn-reset-position" class="btn btn-secondary">Reset Floor Position</button>
            </section>
        </aside>

        <main class="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="canvas-overlay" id="canvas-overlay">
                <span class="overlay-text">Draw a room to start planning</span>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
